<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b5a3a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bot Town">
<title>Bot Town</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Grandstander:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<div id="tint"></div>
<div id="loader"><div class="om">ॐ</div><h1>Bot Town</h1><div class="bar"><i id="fill"></i></div><p id="pct">0%</p><p id="tip">Waking up the neighborhood…</p></div>

<section id="map" class="screen active">
  <div id="mapwrap"><img src="assets/map-v2.webp" alt="Bot Town map" draggable="false"><div id="clouds" aria-hidden="true"><span></span><span></span><span></span></div><canvas id="mapMotes" aria-hidden="true"></canvas><div id="hotspots"></div></div>
  <header class="banner">Bot Town</header>
  <div id="mapTools">
    <button class="ibtn" id="mapMusic" aria-label="Music"></button>
  </div>
  <div id="install" class="toast" hidden>
    <b>Keep Bot Town handy</b>
    <p id="installText">Add it to your home screen and it opens like an app.</p>
    <div><button type="button" class="yes" id="installYes">Install</button><button type="button" id="installNo">Not now</button></div>
  </div>
</section>

<section id="house" class="screen">
  <div id="viewport"><div id="sway"><div id="stage"><img id="roomImg" alt="" draggable="false"><img id="roomFade" alt="" draggable="false"><div id="actors"></div></div><canvas id="motes" aria-hidden="true"></canvas></div><div id="vignette" aria-hidden="true"></div></div>
  <header id="topbar">
    <button class="ibtn" id="back" aria-label="Back to map"></button>
    <div id="title"><b id="houseName"></b><small id="houseRole"></small></div>
    <button class="ibtn" id="musicBtn" aria-label="Music"></button>
    <button class="ibtn" id="camBtn" aria-label="Reset camera"></button>
  </header>
  <div id="statusChip"></div>
  <aside id="tasks" class="parchment collapsed"><button id="tasksHead"><span class="pin"></span><b>To-do</b><span id="taskCount"></span><i class="chev"></i></button><ul id="taskList"></ul></aside>
  <div id="music" class="parchment pop" hidden><b>Music</b><div id="tracks"></div><small>Gentle loops made on your phone</small></div>
  <div id="bubble" hidden></div>

  <nav id="toolbar">
    <button class="tb" id="tbTasks"><i></i><span>Tasks</span></button>
    <button class="tb" id="tbChat"><i></i><span>Chat</span></button>
    <button class="tb" id="tbBusy"><i></i><span>Working</span></button>
    <button class="tb" id="tbVisit"><i></i><span>Sit with</span></button>
  </nav>

  <div id="poses" role="group" aria-label="What they're doing" hidden>
    <button type="button" data-pose="idle">Idle</button>
    <button type="button" data-pose="working">Working</button>
    <button type="button" data-pose="sitting">Sitting</button>
  </div>
  <button id="linkBtn" class="pill main" hidden></button>

  <div id="tiltAsk" class="toast" hidden>
    <b>A little depth</b>
    <p>Tilt your phone and the room shifts, just a few pixels. A finger drag works too.</p>
    <div><button type="button" class="yes" id="tiltYes">Allow tilt</button><button type="button" id="tiltNo">Not now</button></div>
  </div>

  <div id="chat" hidden><div id="chathead"></div><div id="log"></div>
    <div id="replies"><button data-r="Hi! 👋">Hi! 👋</button><button data-r="What are you working on?">Working on?</button><button data-r="Tell me something nice">Something nice</button></div>
    <button id="close" aria-label="Close">✕</button></div>
</section>
<script src="config.js"></script><script src="music.js"></script><script src="app.js"></script>
</body></html>
